
services:
  db:
    image: postgres:17
    container_name: hisabpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hisabpro
      POSTGRES_USER: hisabpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Loopback-only host port so local dev (PG test suite, admin scripts)
    # can reach the real database; 127.0.0.1 keeps it off the LAN/WAN.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hisabpro_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisabpro -d hisabpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hisabpro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hisabpro:${POSTGRES_PASSWORD}@db:5432/hisabpro
      HISABPRO_API_KEY: ${HISABPRO_API_KEY:?Set HISABPRO_API_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      HISABPRO_BACKUP_DIR: /app/backups
      # Encrypted backups at rest (AES-256-GCM). Generate with:
      #   python -c "import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())"
      HISABPRO_BACKUP_KEY: ${HISABPRO_BACKUP_KEY:?Set HISABPRO_BACKUP_KEY in .env}
      HISABPRO_BACKUP_RETENTION_DAYS: ${HISABPRO_BACKUP_RETENTION_DAYS:-30}
      HISABPRO_BACKUP_KEEP_MIN: ${HISABPRO_BACKUP_KEEP_MIN:-5}
      # Rotating application log (5 MB x 5) in a persistent volume.
      HISABPRO_LOG_DIR: /app/logs
      HISABPRO_LOG_LEVEL: ${HISABPRO_LOG_LEVEL:-INFO}
      # Alembic (run by the Dockerfile CMD) owns the schema in production.
      HISABPRO_AUTO_CREATE_TABLES: "false"
    volumes:
      - hisabpro_backups:/app/backups
      - hisabpro_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: hisabpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Offsite backup sync (opt-in). Enable with:
  #   docker compose --profile offsite up -d
  # Needs an rclone config file next to this compose file (see README):
  #   rclone config   # then copy the result to ./rclone.conf
  # RCLONE_REMOTE example: gdrive:snj-gold-lab-backups
  backup-sync:
    image: rclone/rclone:1.69
    container_name: hisabpro-backup-sync
    restart: unless-stopped
    profiles: ["offsite"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_INTERVAL: ${RCLONE_INTERVAL:-86400}
    volumes:
      - hisabpro_backups:/backups:ro
      # :Z needed on SELinux hosts (Fedora/RHEL) so the container can read it.
      - ./rclone.conf:/config/rclone.conf:ro,Z
    # The rclone image has ENTRYPOINT ["rclone"], so we override it to run
    # a shell loop instead. Sync immediately, then every RCLONE_INTERVAL
    # seconds. If RCLONE_REMOTE is empty the container just idles with a
    # warning (so the default compose up never fails because of this profile).
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$${RCLONE_REMOTE}" ]; then
          echo "RCLONE_REMOTE not set - offsite sync disabled. Set it in .env and restart."
          while true; do sleep 3600; done
        fi
        while true; do
          echo "$$(date -Is) rclone sync /backups -> $${RCLONE_REMOTE}"
          rclone sync /backups "$${RCLONE_REMOTE}" --config /config/rclone.conf --transfers 4 || \
            echo "$$(date -Is) sync failed (will retry)"
          sleep "$${RCLONE_INTERVAL}"
        done

volumes:
  hisabpro_data:
  hisabpro_backups:
  hisabpro_logs:
